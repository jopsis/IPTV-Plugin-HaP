name: Build signed APK

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  apk:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Cache kubo build
        id: kubo-cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libipfs.so
            app/src/main/jniLibs/armeabi-v7a/libipfs.so
          key: kubo-${{ runner.os }}-${{ hashFiles('tools/fetch-kubo.sh') }}

      - name: Build IPFS (kubo) binaries
        if: steps.kubo-cache.outputs.cache-hit != 'true'
        run: tools/fetch-kubo.sh

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Read APK version
        id: version
        run: |
          VERSION_NAME="$(./gradlew -q :app:printVersionName)"
          VERSION_CODE="$(./gradlew -q :app:printVersionCode)"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ steps.version.outputs.version_name }}"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify release tag matches versionName
        run: |
          TAG_VERSION="${{ steps.release.outputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          if [ "$TAG_VERSION" != "${{ steps.version.outputs.version_name }}" ]; then
            echo "::error::Release tag '${{ steps.release.outputs.tag }}' must match app versionName '${{ steps.version.outputs.version_name }}' (optional 'v' prefix is accepted)."
            exit 1
          fi

      - name: Create version tag for manual release
        if: github.event_name == 'workflow_dispatch'
        run: |
          RELEASE_TAG="${{ steps.release.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
            HEAD_COMMIT="$(git rev-parse HEAD)"
            if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
              echo "::error::Tag '$RELEASE_TAG' already exists on another commit. Bump versionName before creating a new release."
              exit 1
            fi
            echo "Tag '$RELEASE_TAG' already exists on this commit."
          else
            git tag "$RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Validate signing secrets
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          missing=0
          for secret_name in \
            ANDROID_SIGNING_KEYSTORE_BASE64 \
            ANDROID_SIGNING_STORE_PASSWORD \
            ANDROID_SIGNING_KEY_ALIAS \
            ANDROID_SIGNING_KEY_PASSWORD
          do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing secret $secret_name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode release keystore
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/release.jks"

      - name: Build signed release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/keystore/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Prepare APK artifact
        id: artifact
        run: |
          mkdir -p dist
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          APK_DIR="app/build/outputs/apk/release"

          cp "$APK_DIR/app-universal-release.apk" "dist/IPTV-Plugin-HaP-${VERSION_NAME}.apk"
          cp "$APK_DIR/app-universal-release.apk" "dist/IPTV-Plugin-HaP.apk"
          cp "$APK_DIR/app-arm64-v8a-release.apk" "dist/IPTV-Plugin-HaP-${VERSION_NAME}-arm64-v8a.apk"
          cp "$APK_DIR/app-armeabi-v7a-release.apk" "dist/IPTV-Plugin-HaP-${VERSION_NAME}-armeabi-v7a.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Plugin-HaP-${{ steps.version.outputs.version_name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          NOTES="Signed APK for version ${{ steps.version.outputs.version_name }} (versionCode ${{ steps.version.outputs.version_code }})."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.apk --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.apk \
              --title "$RELEASE_TAG" \
              --notes "$NOTES"
          fi
